<div class="user-panel">
  <h2>User Profile & Caregiver Setup</h2>
  <div id="profileContainer" style="margin-top:20px;"></div>

  <h3 style="margin-top:30px;">Emergency Contacts</h3>
  <div id="contactsContainer"></div>

  <div style="background:#1e293b; padding:16px; border-radius:8px; margin-top:20px;">
    <h4>Add Emergency Contact</h4>
    <form id="contactForm" onsubmit="addContact(event)" style="display:flex; flex-direction:column; gap:10px; max-width:400px;">
      <input type="text" id="cName" placeholder="Name" required style="padding:8px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
      <input type="text" id="cRel" placeholder="Relationship (e.g. Daughter, Neighbor)" required style="padding:8px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
      <input type="tel" id="cPhone" placeholder="Phone Number" required style="padding:8px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
      <input type="number" id="cPriority" placeholder="Priority (1 = highest)" value="4" required style="padding:8px; background:#0f172a; color:#fff; border:1px solid #334155; border-radius:4px;">
      <button type="submit" style="padding:10px; background:#16a34a; color:#fff; border:none; border-radius:4px; cursor:pointer;">Save Contact</button>
    </form>
  </div>
</div>

<div class="family-panel">
  <h2>Family Caregiver Remote Portal</h2>
  <p class="desc">Remote status of Martha Chen in San Francisco for family members in Chicago & Seattle.</p>

  <div id="familySeniorCard" style="background:#1e293b; padding:16px; border-radius:8px; margin:20px 0;"></div>

  <h3>Live Sensor & Environmental Telemetry</h3>
  <div id="telemetryBox" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-top:12px;"></div>

  <div style="background:#1e293b; padding:16px; border-radius:8px; margin-top:24px;">
    <h3>Send Wellbeing Screen Note to Mom</h3>
    <input type="text" id="pingInput" value="Thinking of you Mom! Have a wonderful day." style="width:80%; padding:8px; background:#0f172a; border:1px solid #334155; color:#fff; border-radius:4px;">
    <button onclick="sendPing()" style="padding:8px 16px; background:#2563eb; color:#fff; border:none; border-radius:4px; cursor:pointer;">Send Note</button>
  </div>
</div>
